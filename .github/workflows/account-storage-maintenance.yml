name: Account Storage Production Maintenance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run a read-only report or apply the idempotent historical backfill
        required: true
        type: choice
        default: report
        options:
          - report
          - apply

permissions:
  contents: read

concurrency:
  group: account-storage-production-maintenance
  cancel-in-progress: false

jobs:
  maintain-account-storage:
    if: github.repository == 'Keco-Studio/keco-studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://lulrcirmwwvvnupmwqcq.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout production merge
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Report historical storage inventory
        run: npm run storage:backfill

      - name: Apply idempotent historical storage backfill
        if: github.event.inputs.mode == 'apply'
        run: npm run storage:backfill -- --apply

      - name: Reconcile storage registry and quotas
        if: always()
        run: npm run storage:reconcile
