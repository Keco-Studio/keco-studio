name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]  # PR 创建、更新、重新打开时触发
  push:
    branches:
      - main  # 只有 push 到 main 分支才触发（包括 merge）

jobs:
  build:
    runs-on: ubuntu-latest
    # 只有指定仓库才触发
    if: github.repository == 'Keco-Studio/keco-studio'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        # GitHub 会自动使用 merge commit 来测试 PR，模拟 merge 后的状态
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 安装 Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: 启动 Supabase 本地服务
        run: |
          # 启动 Supabase 服务（后台运行）
          supabase start --ignore-health-check
          # 等待服务就绪（最多等待 90 秒）
          echo "等待 Supabase 服务启动..."
          for i in {1..90}; do
            if curl -s http://127.0.0.1:54321/rest/v1/ > /dev/null 2>&1; then
              echo "Supabase 服务已就绪"
              break
            fi
            echo "等待中... ($i/90)"
            sleep 1
          done
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 重置数据库
        run: |
          # 重试机制：数据库 reset 可能因容器重启问题失败
          for attempt in 1 2 3; do
            echo "尝试重置数据库 (第 $attempt 次)..."
            if supabase db reset; then
              echo "数据库重置成功"
              exit 0
            fi
            echo "数据库重置失败，等待后重试..."
            sleep 5
          done
          echo "数据库重置最终失败"
          exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # 增加超时时间（默认 1 小时）
        timeout-minutes: 90

      - name: Lint project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run lint

      - name: Typecheck API routes
        run: npm run typecheck:api

      # Extract the LOCAL Supabase keys so the RLS behavior tests connect to the
      # local instance (started above), never to the remote project the build
      # step's secrets may point at. Mirrors playwright.yml's extraction.
      - name: Extract local Supabase keys
        id: local-supabase
        run: |
          STATUS_TEXT=$(supabase status)
          ANON_KEY=$(echo "$STATUS_TEXT" | grep -iE "anon key|Publishable" | sed -n 's/.*│[[:space:]]*\(sb_publishable_[^[:space:]]*\|eyJ[^[:space:]]*\).*/\1/p' | head -1)
          SERVICE_KEY=$(echo "$STATUS_TEXT" | grep -iE "service_role key|Secret" | grep -v "JWT" | sed -n 's/.*│[[:space:]]*\(sb_secret_[^[:space:]]*\|eyJ[^[:space:]]*\).*/\1/p' | head -1)
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_KEY" ]; then
            echo "❌ Failed to extract local Supabase keys"; echo "$STATUS_TEXT"; exit 1
          fi
          echo "anon_key=$ANON_KEY" >> "$GITHUB_OUTPUT"
          echo "service_key=$SERVICE_KEY" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$SERVICE_KEY"

      - name: Run unit tests
        env:
          # Point the RLS behavior tests at the LOCAL instance explicitly.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.local-supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.local-supabase.outputs.service_key }}
          # Enable the DB-backed RLS behavior tests: a local Postgres with all
          # migrations applied is running at this point (supabase start + db reset).
          RLS_DB_TESTS: '1'
        run: npm run test:unit

      - name: 构建项目
        env:
          # 从 GitHub Secrets 读取 Supabase 环境变量
          # 这些变量在构建时是必需的，因为代码在模块加载时就会检查
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # SUPABASE_SERVICE_ROLE_KEY 在某些 API 路由中可能需要
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      - name: 停止 Supabase 服务
        if: always()
        run: supabase stop
        continue-on-error: true

      - name: 构建成功 ✅
        run: echo "构建检查通过！可以安全合并到 main"
