name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]  # Trigger when a PR is opened, updated, or reopened
  push:
    branches:
      - main  # Only pushes to the main branch trigger this (including merges)

jobs:
  only-english-characters:
    runs-on: ubuntu-latest
    if: github.repository == 'Keco-Studio/keco-studio'
    steps:
      - uses: actions/checkout@v4

      - name: Fail if any tracked file contains Chinese characters
        run: |
          # CJK Unified Ideographs, Extension A, and Compatibility Ideographs.
          # -I skips binary files (e.g. PNGs). Full-width punctuation like
          # 【】（）｜・： is intentionally NOT matched — it is the legacy
          # script-markup delimiter set, not Chinese-language text.
          if git grep -nI -P '[\x{4E00}-\x{9FFF}\x{3400}-\x{4DBF}\x{F900}-\x{FAFF}]' -- . ; then
            echo "::error::Chinese characters found in the files listed above."
            exit 1
          fi
          echo "No Chinese characters found."

  build:
    runs-on: ubuntu-latest
    # Only run for the specified repository
    if: github.repository == 'Keco-Studio/keco-studio'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # GitHub automatically tests PRs using the merge commit, simulating the post-merge state
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Start local Supabase services
        run: |
          set -euo pipefail
          # Clear any leftover stack/port bindings from a prior partial start.
          supabase stop --no-backup || true
          # Start Supabase services (runs in the background)
          if ! supabase start --ignore-health-check; then
            echo "supabase start failed; recovering once..."
            supabase stop --no-backup || true
            sleep 2
            supabase start --ignore-health-check
          fi
          # Wait for services to be ready (up to 90 seconds)
          echo "Waiting for Supabase services to start..."
          for i in {1..90}; do
            if curl -s http://127.0.0.1:54321/rest/v1/ > /dev/null 2>&1; then
              echo "Supabase services are ready"
              break
            fi
            echo "Waiting... ($i/90)"
            sleep 1
          done
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Reset database
        run: |
          # Retry mechanism: database reset may fail due to container restart issues
          for attempt in 1 2 3; do
            echo "Attempting database reset (attempt $attempt)..."
            if supabase db reset; then
              echo "Database reset succeeded"
              exit 0
            fi
            echo "Database reset failed, waiting before retry..."
            sleep 5
          done
          echo "Database reset failed after all retries"
          exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Increase the timeout (default is 1 hour)
        timeout-minutes: 90

      - name: Configure local Realtime pool
        run: npm run supabase:realtime-pool

      - name: Lint project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run lint

      - name: Typecheck API routes
        run: npm run typecheck:api

      - name: Check MCP Edge Function types
        run: npm run check:mcp

      - name: Test MCP Edge Function
        run: npm run test:mcp

      - name: Test MCP Phase 2 probes
        run: |
          npm run test:unit -- \
            tests/unit/mcp/capabilities-probe.test.ts \
            tests/unit/mcp/load-probe.test.ts \
            tests/unit/mcp/performance-probe.test.ts \
            tests/unit/mcp/evidence-scan.test.ts

      # Extract the LOCAL Supabase keys so the RLS behavior tests connect to the
      # local instance (started above), never to the remote project the build
      # step's secrets may point at. Mirrors playwright.yml's extraction.
      - name: Extract local Supabase keys
        id: local-supabase
        run: |
          STATUS_TEXT=$(supabase status)
          ANON_KEY=$(echo "$STATUS_TEXT" | grep -iE "anon key|Publishable" | sed -n 's/.*│[[:space:]]*\(sb_publishable_[^[:space:]]*\|eyJ[^[:space:]]*\).*/\1/p' | head -1)
          SERVICE_KEY=$(echo "$STATUS_TEXT" | grep -iE "service_role key|Secret" | grep -v "JWT" | sed -n 's/.*│[[:space:]]*\(sb_secret_[^[:space:]]*\|eyJ[^[:space:]]*\).*/\1/p' | head -1)
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_KEY" ]; then
            echo "❌ Failed to extract local Supabase keys"; echo "$STATUS_TEXT"; exit 1
          fi
          echo "anon_key=$ANON_KEY" >> "$GITHUB_OUTPUT"
          echo "service_key=$SERVICE_KEY" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$SERVICE_KEY"

      - name: Run unit tests
        env:
          # Point the RLS behavior tests at the LOCAL instance explicitly.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.local-supabase.outputs.anon_key }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.local-supabase.outputs.service_key }}
          # Enable the DB-backed RLS behavior tests: a local Postgres with all
          # migrations applied is running at this point (supabase start + db reset).
          RLS_DB_TESTS: '1'
        run: npm run test:unit

      - name: Build representative MCP load fixture
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 \
            -f scripts/fixtures/mcp-phase-2-load.sql
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 \
            -c "begin; set local role authenticated; select set_config('request.jwt.claim.sub','aaaaaaaa-bbbb-cccc-dddd-000000000007',true); do \$\$ begin if jsonb_array_length(public.mcp_read_project_structure('22222222-2222-4222-8222-222222222222')->'tables') <> 100 then raise exception 'MCP structure load fixture validation failed'; end if; end \$\$; rollback;"
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 \
            -f scripts/fixtures/mcp-phase-2-load-gates.sql
          pids=()
          for worker in $(seq 1 5); do
            psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
              -v ON_ERROR_STOP=1 \
              -c "begin; set local role authenticated; select set_config('request.jwt.claim.sub','aaaaaaaa-bbbb-cccc-dddd-000000000007',true); select * from public.mcp_create_table_row('22222222-2222-4222-8222-222222222222','33333333-3333-4333-8333-333333333331',gen_random_uuid(),jsonb_build_object('Name','CI concurrent row $worker'),false); commit;" \
              >"/tmp/mcp-concurrent-$worker.log" 2>&1 &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 -c \
            "do \$\$ declare total integer; indices integer; begin select count(*),count(distinct row_index) into total,indices from public.library_assets where library_id='33333333-3333-4333-8333-333333333331' and name like 'CI concurrent row %'; if total <> 5 or indices <> 5 then raise exception 'MCP concurrent row allocation failed'; end if; end \$\$;"

      - name: Build account MCP project fixture
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 \
            -f scripts/fixtures/mcp-account-projects.sql
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 \
            -f scripts/fixtures/mcp-account-projects-gates.sql

      - name: Scan committed MCP evidence
        shell: bash
        run: |
          evidence=()
          for file in docs/mcp/phase-2-client-matrix.md docs/mcp/phase-2-performance.json; do
            if [ -f "$file" ]; then evidence+=("$file"); fi
          done
          if [ "${#evidence[@]}" -gt 0 ]; then
            npm run scan:mcp-evidence -- "${evidence[@]}"
          fi

      - name: Build project
        env:
          # Read Supabase environment variables from GitHub Secrets
          # These are required at build time because the code checks them at module load
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # SUPABASE_SERVICE_ROLE_KEY may be needed by some API routes
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      - name: Stop Supabase services
        if: always()
        run: supabase stop
        continue-on-error: true

      - name: Build succeeded ✅
        run: echo "Build checks passed! Safe to merge into main"
