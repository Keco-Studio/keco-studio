name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
      - 'release/**'
    types: [opened, synchronize, reopened]

jobs:

  check-migrations:
    runs-on: ubuntu-latest
    name: Check for Migration Changes
    if: github.repository == 'Keco-Studio/keco-studio' || github.repository == 'xzy1124/keco-studio'
    outputs:
      has-migrations: ${{ steps.check.outputs.has-migrations }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history to allow branch comparison

      - name: Check for migration changes
        id: check
        run: |
          echo "🔍 Checking migration files..."
          echo "Current branch: ${{ github.ref }}"
          echo "Current commit: ${{ github.sha }}"

          # List all migration files (for debugging)
          echo "📋 Migration files on current branch:"
          if [ -d "supabase/migrations" ]; then
            ls -la supabase/migrations/*.sql 2>/dev/null || echo "  No .sql files found"
          else
            echo "  supabase/migrations directory does not exist"
          fi

          # Determine the base branch
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            BASE_BRANCH="origin/main"
            # If main does not exist, try master
            if ! git rev-parse --verify "$BASE_BRANCH" >/dev/null 2>&1; then
              BASE_BRANCH="origin/master"
            fi
          elif [[ "${{ github.ref }}" =~ ^refs/heads/release ]]; then
            # Compare release branches against main
            BASE_BRANCH="origin/main"
            if ! git rev-parse --verify "$BASE_BRANCH" >/dev/null 2>&1; then
              BASE_BRANCH="origin/master"
            fi
          else
            # PRs and other cases: compare against main
            BASE_BRANCH="origin/main"
            if ! git rev-parse --verify "$BASE_BRANCH" >/dev/null 2>&1; then
              BASE_BRANCH="origin/master"
            fi
          fi

          echo "Base branch: $BASE_BRANCH"

          # Check migration file changes on the current branch relative to the base branch
          # If the base branch does not exist (first push), check whether any migration files exist
          if ! git rev-parse --verify "$BASE_BRANCH" >/dev/null 2>&1; then
            echo "⚠️ Base branch does not exist, checking for migration files..."
            if [ -d "supabase/migrations" ] && [ "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
              echo "has-migrations=true" >> $GITHUB_OUTPUT
              echo "✅ Migration files detected (first push)"
            else
              echo "has-migrations=false" >> $GITHUB_OUTPUT
              echo "ℹ️ No migration files"
            fi
          else
            # Fetch the base branch commit
            git fetch origin ${BASE_BRANCH#origin/}:${BASE_BRANCH#origin/} 2>/dev/null || true

            # Diff the current branch against the base branch
            MIGRATION_FILES=$(git diff --name-only "$BASE_BRANCH" HEAD | grep "^supabase/migrations/" || true)

            if [ -n "$MIGRATION_FILES" ]; then
              echo "has-migrations=true" >> $GITHUB_OUTPUT
              echo "✅ Migration file changes detected (relative to $BASE_BRANCH)"
              echo "Changed migration files:"
              echo "$MIGRATION_FILES" | while read -r file; do
                echo "  - $file"
              done
            else
              echo "has-migrations=false" >> $GITHUB_OUTPUT
              echo "No migration file changes (relative to $BASE_BRANCH)"
            fi
          fi


  migrate-database:
    runs-on: ubuntu-latest
    name: Run Supabase Migrations
    needs: check-migrations
    # For main and release branches, always run migrations (supabase db push is idempotent
    # and only applies unapplied migrations)
    # This ensures migrations can be re-applied even if a previous run failed
    if: |
      (github.repository == 'Keco-Studio/keco-studio' || github.repository == 'xzy1124/keco-studio') && (
        needs.check-migrations.outputs.has-migrations == 'true' ||
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/heads/release/')
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Check migration files exist
        run: |
          if [ ! -d "supabase/migrations" ] || [ -z "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
            echo "⚠️ No migration files found, skipping migration job"
            exit 0
          else
            echo "✅ Migration files found, proceeding with migrations"
            ls -la supabase/migrations/*.sql
          fi

      # Select the Supabase project and corresponding Access Token based on the branch
      # main branch → Production, release branches → Preview
      - name: Select Supabase Project and Token
        id: select-project
        env:
          PROD_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_PROD }}
          PREVIEW_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_PREVIEW }}
          GENERAL_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            # main branch uses the Production environment
            echo "project-ref=${{ secrets.SUPABASE_PROJECT_REF_PROD }}" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
            # Use the dedicated Production token if configured; otherwise fall back to the general token
            if [ -n "$PROD_TOKEN" ] && [ "$PROD_TOKEN" != "" ]; then
              echo "access-token=$PROD_TOKEN" >> $GITHUB_OUTPUT
              echo "✅ Using Production Supabase project (dedicated token)"
            else
              echo "access-token=$GENERAL_TOKEN" >> $GITHUB_OUTPUT
              echo "✅ Using Production Supabase project (general token)"
            fi
          elif [[ "${{ github.ref }}" =~ ^refs/heads/release ]]; then
            # release branches (including release/**) use the Preview environment
            echo "project-ref=${{ secrets.SUPABASE_PROJECT_REF_PREVIEW }}" >> $GITHUB_OUTPUT
            echo "environment=preview" >> $GITHUB_OUTPUT
            # Use the dedicated Preview token if configured; otherwise fall back to the general token
            if [ -n "$PREVIEW_TOKEN" ] && [ "$PREVIEW_TOKEN" != "" ]; then
              echo "access-token=$PREVIEW_TOKEN" >> $GITHUB_OUTPUT
              echo "✅ Using Preview Supabase project (release branch, dedicated token)"
            else
              echo "access-token=$GENERAL_TOKEN" >> $GITHUB_OUTPUT
              echo "✅ Using Preview Supabase project (release branch, general token)"
            fi
          else
            # Other cases (PRs, etc.) use the Preview environment
            echo "project-ref=${{ secrets.SUPABASE_PROJECT_REF_PREVIEW }}" >> $GITHUB_OUTPUT
            echo "environment=preview" >> $GITHUB_OUTPUT
            if [ -n "$PREVIEW_TOKEN" ] && [ "$PREVIEW_TOKEN" != "" ]; then
              echo "access-token=$PREVIEW_TOKEN" >> $GITHUB_OUTPUT
              echo "✅ Using Preview Supabase project (dedicated token)"
            else
              echo "access-token=$GENERAL_TOKEN" >> $GITHUB_OUTPUT
              echo "✅ Using Preview Supabase project (general token)"
            fi
          fi

      - name: Link to Supabase project
        run: |
          echo "🔗 Linking to Supabase project: ${{ steps.select-project.outputs.environment }}"
          echo "📋 Project Ref: ${{ steps.select-project.outputs.project-ref }}"
          supabase link --project-ref ${{ steps.select-project.outputs.project-ref }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ steps.select-project.outputs.access-token }}

      - name: Push database migrations
        run: |
          echo "🚀 Pushing database migrations to the ${{ steps.select-project.outputs.environment }} environment..."
          supabase db push --include-all
          echo "✅ Migrations complete"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ steps.select-project.outputs.access-token }}
        continue-on-error: false


  deploy:
    runs-on: ubuntu-latest
    needs: [check-migrations, migrate-database]
    if: (github.repository == 'Keco-Studio/keco-studio' || github.repository == 'xzy1124/keco-studio') && always() && (needs.migrate-database.result == 'success' || needs.migrate-database.result == 'skipped')
    name: Deploy to Vercel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Determine deployment environment based on branch
      # main branch → Production, release branches → Preview
      - name: Determine deployment environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "is_prod=true" >> $GITHUB_OUTPUT
            echo "deployment_target=production" >> $GITHUB_OUTPUT
            echo "✅ Deploying to Production environment (main branch)"
          elif [[ "${{ github.ref }}" =~ ^refs/heads/release ]]; then
            # release branches (including release/**) deploy to the Preview environment
            echo "environment=preview" >> $GITHUB_OUTPUT
            echo "is_prod=false" >> $GITHUB_OUTPUT
            echo "deployment_target=preview" >> $GITHUB_OUTPUT
            echo "✅ Deploying to Preview environment (release branch)"
          else
            # PRs and other cases deploy to Preview
            echo "environment=preview" >> $GITHUB_OUTPUT
            echo "is_prod=false" >> $GITHUB_OUTPUT
            echo "deployment_target=preview" >> $GITHUB_OUTPUT
            echo "✅ Deploying to Preview environment"
          fi

      # Pull Vercel environment variables based on deployment environment
      # This will automatically use the correct Supabase config (Production or Preview)
      # from Vercel Dashboard based on the environment determined above
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=${{ steps.env.outputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: |
          if [[ "${{ steps.env.outputs.is_prod }}" == "true" ]]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        run: |
          if [[ "${{ steps.env.outputs.is_prod }}" == "true" ]]; then
            # Production deployment (main branch)
            echo "🚀 Deploying to Production environment..."
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          elif [[ "${{ github.ref }}" =~ ^refs/heads/release/ ]]; then
            # Release branches deploy to the Preview environment; a fixed domain can be set via a Secret
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            echo "🚀 Deploying to Preview environment (Branch: $BRANCH_NAME)..."
            DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
            echo "📦 Deployment URL: $DEPLOYMENT_URL"
            if [ -n "${{ secrets.VERCEL_PREVIEW_ALIAS_DOMAIN }}" ]; then
              echo "🔗 Setting alias ${{ secrets.VERCEL_PREVIEW_ALIAS_DOMAIN }}..."
              vercel alias set "$DEPLOYMENT_URL" "${{ secrets.VERCEL_PREVIEW_ALIAS_DOMAIN }}" --token=${{ secrets.VERCEL_TOKEN }}
            else
              echo "ℹ️ VERCEL_PREVIEW_ALIAS_DOMAIN not configured, skipping fixed domain alias"
            fi
            echo "✅ Release deployment complete, Branch: $BRANCH_NAME"
            if [ -n "${{ secrets.VERCEL_PREVIEW_ALIAS_DOMAIN }}" ]; then
              echo "🌐 Release URL: https://${{ secrets.VERCEL_PREVIEW_ALIAS_DOMAIN }}"
            fi
          else
            # Other Preview deployments (PRs, etc.)
            echo "🚀 Deploying to Preview environment..."
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
