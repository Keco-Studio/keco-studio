name: Release Desktop Apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a leading v
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      VERSION: "${{ inputs.version }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - run: npm --prefix desktop ci
      - run: node desktop/scripts/apply-native-sdk-patches.mjs
      - run: node scripts/create-release-manifest.mjs "$env:VERSION" app.json
        shell: pwsh
        working-directory: desktop
      - run: zig build -Dtarget=x86_64-windows-gnu -Dplatform=windows -Doptimize=ReleaseFast
        working-directory: desktop
      - shell: pwsh
        working-directory: desktop
        run: |
          node node_modules/@native-sdk/cli/bin/native.js package --target windows --manifest app.json --binary zig-out/bin/KecoStudio.exe --output release/windows
          if (!(Test-Path release/windows/bin/keco-studio.exe)) { throw 'Native SDK package is missing the executable' }
          if (!(Test-Path release/windows/bin/WebView2Loader.dll)) { throw 'Native SDK package is missing WebView2Loader.dll' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path release/windows/bin/keco-studio.exe))
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw "Expected x64 PE machine type, found 0x{0:X4}" -f $machine }
      - run: choco install innosetup --no-progress --yes
      - shell: pwsh
        run: |
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile desktop/release/windows/WebView2Bootstrapper.exe
          $env:KECO_DESKTOP_VERSION = $env:VERSION
          $env:KECO_DESKTOP_SOURCE_DIR = (Resolve-Path desktop/release/windows).Path
          iscc desktop/installer/KecoStudio.iss
          Move-Item "desktop/installer/Output/Keco-Studio-Setup-$env:VERSION-windows-x64.exe" desktop/
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: "desktop/Keco-Studio-Setup-${{ inputs.version }}-windows-x64.exe"

  build-macos-x64:
    runs-on: macos-15-intel
    env:
      VERSION: "${{ inputs.version }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - run: npm --prefix desktop ci
      - run: node desktop/scripts/apply-native-sdk-patches.mjs
      - run: node scripts/create-release-manifest.mjs "$VERSION" app.json
        working-directory: desktop
      - run: zig build -Dtarget=x86_64-macos -Dplatform=macos -Doptimize=ReleaseFast
        working-directory: desktop
      - run: |
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              while IFS= read -r mount_point; do
                hdiutil detach -quiet -force "$mount_point" || true
              done < <(find release -type d -path '*.native-work-*/mount' -prune -print)
            fi
            rm -rf release
            mkdir -p release
            if node node_modules/@native-sdk/cli/bin/native.js package --target macos --manifest app.json --binary zig-out/bin/KecoStudio --output "release/Keco Studio.app" --archive --signing adhoc --optimize ReleaseFast; then
              mv release/*.dmg "Keco-Studio-${VERSION}-macos-x64.dmg"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "macOS package attempt ${attempt}/3 failed; retrying after a clean output reset." >&2
            sleep 5
          done
        working-directory: desktop
      - run: |
          mount_point="$(mktemp -d)"
          hdiutil attach "Keco-Studio-${VERSION}-macos-x64.dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT
          test "$(lipo -archs "$mount_point/Keco Studio.app/Contents/MacOS/keco-studio")" = "x86_64"
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-x64
          path: "desktop/Keco-Studio-${{ inputs.version }}-macos-x64.dmg"

  build-macos-arm64:
    runs-on: macos-14
    env:
      VERSION: "${{ inputs.version }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - run: npm --prefix desktop ci
      - run: node desktop/scripts/apply-native-sdk-patches.mjs
      - run: node scripts/create-release-manifest.mjs "$VERSION" app.json
        working-directory: desktop
      - run: zig build -Dtarget=aarch64-macos -Dplatform=macos -Doptimize=ReleaseFast
        working-directory: desktop
      - run: |
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              while IFS= read -r mount_point; do
                hdiutil detach -quiet -force "$mount_point" || true
              done < <(find release -type d -path '*.native-work-*/mount' -prune -print)
            fi
            rm -rf release
            mkdir -p release
            if node node_modules/@native-sdk/cli/bin/native.js package --target macos --manifest app.json --binary zig-out/bin/KecoStudio --output "release/Keco Studio.app" --archive --signing adhoc --optimize ReleaseFast; then
              mv release/*.dmg "Keco-Studio-${VERSION}-macos-arm64.dmg"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "macOS package attempt ${attempt}/3 failed; retrying after a clean output reset." >&2
            sleep 5
          done
        working-directory: desktop
      - run: |
          mount_point="$(mktemp -d)"
          hdiutil attach "Keco-Studio-${VERSION}-macos-arm64.dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT
          test "$(lipo -archs "$mount_point/Keco Studio.app/Contents/MacOS/keco-studio")" = "arm64"
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: "desktop/Keco-Studio-${{ inputs.version }}-macos-arm64.dmg"

  publish:
    needs: [build-windows, build-macos-x64, build-macos-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: "${{ github.token }}"
      VERSION: "${{ inputs.version }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: node desktop/scripts/assert-release-assets.mjs "$VERSION" release-assets
      - run: |
          gh release create "v${VERSION}" --draft --title "Keco Studio ${VERSION}" --generate-notes
          gh release upload "v${VERSION}" release-assets/*
          gh release view "v${VERSION}" --json assets --jq '.assets[].name' > release-asset-names.txt
          node desktop/scripts/assert-release-assets.mjs "$VERSION" --names-file release-asset-names.txt
          gh release edit "v${VERSION}" --draft=false
