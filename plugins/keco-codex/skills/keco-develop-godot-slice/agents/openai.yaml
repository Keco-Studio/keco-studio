interface:
  display_name: "Develop Godot Slice"
  short_description: "Build and evaluate Godot slices from Keco designs"
  brand_color: "#0F766E"
  default_prompt: "Use $keco-develop-godot-slice to implement the next Godot gameplay slice from my Keco project and evaluate it."
dependencies:
  tools:
    - type: "mcp"
      value: "keco"
      description: "Keco Streamable HTTP MCP server"
      transport: "streamable_http"
      url: "https://lulrcirmwwvvnupmwqcq.supabase.co/functions/v1/mcp"
    - type: "mcp"
      value: "godot"
      description: "Godot editor and runtime MCP server"
    - type: "mcp"
      value: "pixellab"
      description: "PixelLab UI image generation MCP server"
policy:
  allow_implicit_invocation: true
