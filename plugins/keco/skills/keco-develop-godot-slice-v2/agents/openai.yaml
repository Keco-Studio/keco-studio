interface:
  display_name: "Godot Slice V2"
  short_description: "Run a reviewed Keco-to-Godot slice workflow"
  brand_color: "#0F766E"
  default_prompt: "Use $keco-develop-godot-slice-v2 to run the reviewed Keco Godot slice workflow."
dependencies:
  tools:
    - type: "mcp"
      value: "keco"
      description: "Keco Streamable HTTP MCP server"
      transport: "streamable_http"
      url: "https://lulrcirmwwvvnupmwqcq.supabase.co/functions/v1/mcp"
    - type: "mcp"
      value: "godot"
      description: "Godot editor and runtime MCP server"
    - type: "mcp"
      value: "pixellab"
      description: "PixelLab image generation MCP server"
policy:
  allow_implicit_invocation: false
