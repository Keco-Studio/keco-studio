interface:
  display_name: "Godot Slice V2"
  short_description: "Plan and execute document-driven Keco Godot slices"
  brand_color: "#0F766E"
  default_prompt: "Read the relevant Keco project document, plan its development ideas as ordered Godot slices, and execute them with reviewed runtime evidence."
dependencies:
  tools:
    - type: "mcp"
      value: "keco"
      description: "Keco Streamable HTTP MCP server"
      transport: "streamable_http"
      url: "https://lulrcirmwwvvnupmwqcq.supabase.co/functions/v1/mcp"
    - type: "mcp"
      value: "godot"
      description: "Godot editor and runtime MCP server"
    - type: "mcp"
      value: "pixellab"
      description: "PixelLab image generation MCP server"
policy:
  allow_implicit_invocation: true
